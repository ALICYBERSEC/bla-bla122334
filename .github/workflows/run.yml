name: solve
on: [push, workflow_dispatch]
jobs:
  solve:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: lldb watchpoint
        run: |
          set +e
          chmod +x real_bin
          printf 'AAAAAAAA\nBBBBBBBB\nCCCCCCCC\nDDDDDDDD\nEEEEEEEE\nFFFFFFFF\n' > input.txt
          xcrun lldb --version
          ( xcrun lldb -b -o "command script import ./solve.py" -o "quit" 2>&1 | tee lldb_stdout.txt ) & P=$!
          ( sleep 150; kill $P 2>/dev/null ) & wait $P 2>/dev/null
          echo "==== lldb stdout (tail) ===="; tail -30 lldb_stdout.txt
          echo "==== program output ===="; cat prog_out.txt 2>/dev/null | head
          echo "==== watchpoint log ===="; head -220 wlog.txt 2>/dev/null
