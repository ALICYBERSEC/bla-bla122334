name: solve
on: [push, workflow_dispatch]
jobs:
  solve:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: run real_bin
        run: |
          set +e
          chmod +x real_bin
          file real_bin; echo "size $(stat -f%z real_bin)"
          guard () {
            echo "======== $1 ========"
            ( eval "$2" | ./real_bin >o.txt 2>&1 ) & P=$!
            ( sleep 45; kill $P 2>/dev/null ) 2>/dev/null &
            wait $P 2>/dev/null
            cat o.txt
          }
          guard "no input"   'printf ""'
          guard "empty line" 'printf "\n"'
          guard "AAAA"       'printf "AAAA\n"'
          echo "======== FLAG? ========"
          grep -aiE 'flare-on\.com|@flare|flag\{' o.txt 2>/dev/null || echo "(scan output above too)"
