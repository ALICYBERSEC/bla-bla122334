name: run
on: { workflow_dispatch: {} }
jobs:
  m:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: describe
        run: |
          chmod +x click_me real_bin decoy_slice
          file click_me
          lipo -detailed_info click_me || true
      - name: run decoy
        run: |
          ( ./click_me & P=$!; sleep 10; kill $P 2>/dev/null ) | cat -v | head -80 || true
          ( ./decoy_slice & P=$!; sleep 10; kill $P 2>/dev/null ) | cat -v | head -80 || true
      - name: feed 5 known
        run: |
          printf 'reduce_not_deflate\njbig2_fax_geometry\nmainframe_ebcdic_ghost\nudf_tagged_descriptor\nFLARE-STANDARD-ANTIVIRUS-TEST-FILE!\nPLACEHOLDER\n' > in.txt
          ( ./real_bin < in.txt & P=$!; sleep 8; kill $P 2>/dev/null ) | cat -v | head -40 || true
