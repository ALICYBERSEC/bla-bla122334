name: solve
on: [push, workflow_dispatch]
jobs:
  solve:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: memscan
        run: |
          set +e
          chmod +x real_bin
          clang -arch arm64 -dynamiclib -o scan.dylib scan.c && echo built
          ( yes '' | head -50 | DYLD_INSERT_LIBRARIES=./scan.dylib ./real_bin >o.txt 2>&1 ) & P=$!
          ( sleep 30; kill $P 2>/dev/null ) & wait $P 2>/dev/null
          echo "==== program output ===="; head -20 o.txt
          echo "==== HITS ===="; grep -a 'HIT' o.txt | sort -u
