name: solve
on: [push, workflow_dispatch]
jobs:
  solve:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: watch gc copy
        run: |
          set +e
          chmod +x real_bin
          printf 'MK7pQ2wZx9Rt\nBBBB\nCCCC\nDDDD\nEEEE\nFFFF\n' > input.txt
          ( xcrun lldb -b -o "command script import ./solve.py" -o quit 2>&1 | tail -5 ) & P=$!
          ( sleep 200; kill $P 2>/dev/null ) & wait $P 2>/dev/null
          echo "==== cmp.txt ===="; cat cmp.txt
