name: solve
on: [push, workflow_dispatch]
jobs:
  solve:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: run everything
        run: |
          set +e
          B=clickme_uni
          echo "size: $(stat -f%z $B) bytes"; lipo -info $B; lipo -archs $B
          chmod +x $B
          for a in $(lipo -archs $B 2>/dev/null); do
            lipo $B -thin $a -output cm_$a 2>/dev/null && chmod +x cm_$a
          done
          ls -la $B cm_* 2>/dev/null
          run_one () {
            echo "======== RUN $1 ========"
            timeout 60 arch -arm64e ./$1 </dev/null 2>&1
            echo "--- (retry plain) ---"
            timeout 60 ./$1 </dev/null 2>&1
          }
          for b in $B cm_*; do [ -f "$b" ] && run_one "$b"; done | tee out_all.txt
          echo "======== FLAG? ========"
          grep -aiE 'flare-on\.com|@flare|flag\{' out_all.txt || echo "no @flare-on.com line"
