name: solve
on: [push, workflow_dispatch]
jobs:
  solve:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: interpose + run
        run: |
          set +e
          chmod +x real_bin
          clang -arch arm64 -dynamiclib -o hook.dylib hook.c && echo "built hook.dylib"
          run() {
            echo "======== $1 ========"
            ( printf "$2" | DYLD_INSERT_LIBRARIES=./hook.dylib ./real_bin >o.txt 2>&1 ) & P=$!
            ( sleep 40; kill $P 2>/dev/null ) & wait $P 2>/dev/null
            cat o.txt
          }
          run "six distinct" 'AAAA\nBBBB\nCCCC\nDDDD\nEEEE\nFFFF\n'
          echo "======== possible flag parts (from B= lines) ========"
          grep -aA2 -E '\[memcmp|\[strcmp|\[bcmp|\[strncmp' o.txt | grep -aE 'B=' | sort -u
