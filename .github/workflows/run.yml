name: run
on: { workflow_dispatch: {} }
jobs:
  m:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: get flag
        run: |
          chmod +x real_bin
          printf 'reduce_not_deflate\njbig2_fax_geometry\nmainframe_ebcdic_ghost\nudf_tagged_descriptor\nFLARE-STANDARD-ANTIVIRUS-TEST-FILE!\n\303\230d1n_373rn4l_fl4r3\n' > in.txt
          ( ./real_bin < in.txt & P=$!; sleep 10; kill $P 2>/dev/null ) | cat || true
