name: solve
on: [push, workflow_dispatch]
jobs:
  solve:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: dump expected hashes
        run: |
          set +e
          chmod +x real_bin
          printf 'reduce_not_deflate\njbig2_fax_geometry\nAAAA\nBBBB\nCCCC\nDDDD\n' > input.txt
          ( xcrun lldb -b -o "command script import ./solve.py" -o quit 2>&1 | tail -3 ) & P=$!
          ( sleep 120; kill $P 2>/dev/null ) & wait $P 2>/dev/null
          echo "==== hashes.txt ===="; cat hashes.txt
